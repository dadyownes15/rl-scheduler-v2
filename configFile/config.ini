[carbon setting]
# Carbon reward knobs (two layers):
# 1) reward_function → used during TRAINING per-step reward (in train.py PerStepRewardCalculator)
#    Options:
#      - co2_wait_combined: Combined reward. Penalizes wait for ALL queued jobs (bounded slowdown)
#        plus carbon penalty for the scheduled job. Use to jointly optimize latency and carbon.
#      - co2_direct: Carbon-only component. Penalty equals actual CO2 emissions (gCO2) of the
#        scheduled job scaled by its carbon_consideration. Use for pure-carbon optimization or
#        when latency is handled elsewhere.
#      - emission_ratio: Ratio of actual vs worst-case emissions within a 24h window. Useful when you
#        want a scale-free signal that rewards picking cleaner windows without absolute units.
#      - carbon_intensity_scaled: Uses current carbon intensity scaled by job energy. Lightweight
#        proxy when you want to avoid full emissions integration.
#
# 2) carbon_reward_function → used for EVALUATION/POST-ANALYSIS (in greenPower.py getCarbonAwareReward)
#    Options:
#      - emission_ratio: Original method. Compares actual vs worst-case emissions per job; averages
#        ratios weighted by carbon_consideration. Good for benchmarking relative carbon efficiency.
#      - co2_direct: Sum of actual CO2 emissions per job scaled by carbon_consideration (negative
#        penalty; internally scales gCO2 to kgCO2). Good when you want absolute emissions.
#      - fcfs_normalized: Compares emissions against an FCFS baseline (percentage change weighted by
#        carbon_consideration). Use when you need improvement-over-baseline metrics.
#
# Windowing for carbon calculations (affects worst-case computations and some analyses):
#  - use_dynamic_window = True  → For each job, worst-case window spans from its start to when the
#    last job in the episode ends (context-aware, realistic for batch schedules).
#  - use_dynamic_window = False → Fixed 24-hour window from each job's start (stable baseline).
use_dynamic_window = True
reward_function = co2_wait_combined
carbon_reward_function = co2_direct

[reward parameters]
carbon_weight = 1.0
wait_weight = 0.1

